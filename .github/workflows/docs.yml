name: Docs

on:
  push:
    paths:
      - docs/**
      - huspacy/**
      - mkdocs.yml
      - .github/workflows/docs.yml
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout huspacy
      uses: actions/checkout@v7
      with:
        path: repo

    - name: Checkout huspacy/huspacy.github.io
      # Only the deploy needs the pages repository, and only from master
      if: github.ref == 'refs/heads/master'
      uses: actions/checkout@v7
      with:
        repository: huspacy/huspacy.github.io
        path: huspacy.github.io
        ssh-key: ${{ secrets.GH_PAGES_GIT_KEY }}
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.8"
        enable-cache: true

    - name: Set up Python 3.10
      run: uv python install 3.10

    - name: Install Python dependencies
      run: |
        cd repo/huspacy
        uv sync --locked --python 3.10 --group docs --group dev --all-extras
        uv pip install --python .venv/bin/python https://github.com/nytud/emmorphpy/releases/download/v1.1.0/emmorphpy-1.1.0-py3-none-any.whl
        uv pip install --python .venv/bin/python https://github.com/vadno/emmorph2ud2/releases/download/v1.0.1/emmorph2ud2-1.0.1-py3-none-any.whl

    - name: Install hfst
      run: sudo apt-get install -y hfst

    - name: Test citation file
      run: |
        cd repo/huspacy
        uv run --locked cffconvert -i ../CITATION.cff --validate

    - name: Test code snippets in the documentation
      run: |
        cd repo/huspacy
        uv run --locked pytest --codeblocks --verbosity=3 ./README.md  ../docs/huspacy/*.md ../docs/recipes/*.md

    - name: Generate docs
      run: |
        cd repo
        source huspacy/.venv/bin/activate

        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          cd ../huspacy.github.io
          git checkout gh-pages
          git pull --rebase
          cd ../repo
          mkdocs build --clean -d ../huspacy.github.io
        else
          mkdocs build --clean -d ../site
        fi

    - name: Publish
      if: github.ref == 'refs/heads/master' #|| github.ref == 'refs/heads/develop'
      run: |
        cd huspacy.github.io
        git config user.email "gyorgy+bot@orosz.link"
        git config user.name "HuSpaCy Bot"
        git add .
        git commit -m "Updated website to reflect changes at https://github.com/huspacy/huspacy/commit/$GITHUB_SHA"
        git push origin gh-pages
