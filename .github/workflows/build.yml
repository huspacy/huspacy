name: Build

on:
  push:
    paths:
      - huspacy/**
      - .github/workflows/build.yml
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huspacy
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --group dev

      - name: Test with pytest
        run: |
          uv run --locked pytest -m "not slow"

      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch

      - name: Build package
        env:
          BRANCH_NAME: ${{ steps.extract_branch.outputs.branch }}
        run: |
          echo "Running the pipeline on $BRANCH_NAME branch"
          sed -i -E 's/name = "huspacy"/name = "huspacy-nightly"/' pyproject.toml
          uv version "$(uv version --short)-dev.$GITHUB_RUN_NUMBER"
          uv build --wheel

      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.10'
        with:
          name: wheel-${{ matrix.python-version }}
          path: huspacy/dist/*.whl
