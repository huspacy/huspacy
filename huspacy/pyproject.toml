[project]
name = "huspacy"
version = "0.13.1"
description = "HuSpaCy: industrial strength Hungarian natural language processing"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = "Apache-2.0"
authors = [{ name = "SzegedAI, MILAB", email = "gyorgy@orosz.link" }]
maintainers = [{ name = "György Orosz", email = "gyorgy@orosz.link" }]
keywords = [
    "nlp", "huspacy", "Hungarian", "text processing", "text processing", "language processing", "text mining",
    "tokenization", "sentence boundary detection", "sbd", "sentence splitting", "pos tagging", "tagging",
    "lemmatization", "ner", "named entity recognition", "parsing", "word embeddings", "word vectors",
    "spacy", "spacy model",
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Text Processing',
    'Topic :: Text Processing :: Linguistic',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Scientific/Engineering :: Human Machine Interfaces',
    'Topic :: Scientific/Engineering :: Information Analysis',
]
dependencies = [
    "packaging>=21.3,<22.0",
]

[project.optional-dependencies]
trf = [
    "transformers>=4.24.0,<5.0.0",
    "spacy-alignments>=0.8.6,<0.9.0",
    "torch",
]
np = [
    "benepar==0.2.0",
]
morph = []

[project.urls]
Homepage = "https://github.com/huspacy/huspacy"
Repository = "https://github.com/huspacy/huspacy"

[dependency-groups]
dev = [
    "spacy==3.7.5",
    # spacy 3.7.5 ships extensions built against numpy 1.x
    "numpy<2",
    # spacy 3.7.5 imports click directly, which typer>=0.16 no longer installs
    "typer<0.16",
    "bump2version~=1.0.1",
    "pytest~=8.3.3",
    "ruff~=0.7.1",
]
docs = [
    # huspacy.download() installs models with `python -m pip`, which uv venvs omit
    "pip>=22.3.1",
    "lazydocs~=0.4.8",
    "pytest-codeblocks~=0.17.0",
    "mkdocs~=1.6.1",
    "mkdocs-material~=9.5.42",
    "mkdocs-git-revision-date-localized-plugin~=1.3.0",
    "mkdocstrings[python]~=0.26.2",
    "mkdocs-gen-files~=0.5.0",
    "mkdocs-autorefs~=1.2.0",
    "mkdocs-meta-descriptions-plugin~=3.0.0",
    "cffconvert~=2.0.0",
]

[build-system]
requires = ["poetry-core>=2.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# The package directory does not follow the project name when the nightly wheel is
# built (the project is renamed to `huspacy-nightly`), so it is configured explicitly.
packages = [{ include = "huspacy" }]

[tool.uv]
required-version = ">=0.13"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-ra -v -m 'not slow'"
testpaths = [
    "tests",
]
